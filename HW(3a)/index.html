<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
      
        
        <div class="rabbit-group">
            <img src="images/rabbit5.png" alt="rabbit5" class="rabbit5">
            <img src="images/rabbit6.png" alt="rabbit6" class="rabbit6">
            <img src="images/rabbit7.png" alt="rabbit7" class="rabbit7" onclick="this.classList.add('fly-away')" onanimationend="this.classList.remove('fly-away')">
            <img src="images/rabbit8.png" alt="rabbit8" class="rabbit8" onclick="this.classList.add('tilt')" onanimationend="this.classList.remove('tilt')">
        </div>

        <div class="moving-container">
            <img src="images/rabbit1.png" alt="Hovered Rabbit" class="sitting">
            <img src="images/rabbit2.png" alt="Moving Rabbit" class="running">
        </div>

        <div class="moving-container2">
            <img src="images/rabbit4.png" alt="Rabbit4" class="rabbit4">
            <img src="images/rabbit3.png" alt="Rabbit3" class="rabbit3">
        </div>



    </body>
</html>
